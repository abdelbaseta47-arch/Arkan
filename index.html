<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أركان الخليج ERP</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden flex flex-col">

    <!-- شاشة التحميل -->
    <div id="loader" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center text-white">
        <i class="ph-duotone ph-circle-notch animate-spin text-6xl text-blue-500 mb-4"></i>
        <h2 class="text-xl font-bold">جاري الاتصال بالسحابة...</h2>
    </div>

    <!-- شريط الإشعارات -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 transition-all duration-300 -translate-y-20 opacity-0 z-[200]">
        <i id="toast-icon" class="ph-fill ph-check-circle text-emerald-400 text-xl"></i>
        <span id="toast-msg" class="font-medium text-sm">تم</span>
    </div>

    <!-- حاوية التطبيق -->
    <div id="app-container" class="w-full h-full hidden"></div>

    <!-- الكود البرمجي الرئيسي -->
    <script type="module">
        // 1. استيراد مكتبات Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 2. إعدادات Firebase
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // إعدادات تجريبية تعمل على بيئة التطوير
            projectId: "arkan-erp-demo" 
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'arkan-erp-v1';

        // دالة تحديد مسار البيانات
        const getPath = (col) => collection(db, 'artifacts', appId, 'public', 'data', col);

        // 3. حالة التطبيق (State)
        let currentUser = null;
        let appData = { users: [], projects: [], attendance: [], requests: [] };
        let activeAdminTab = 'dashboard';
        let costChart = null;

        // 4. دوال مساعدة
        window.showToast = (msg, type = 'success') => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').className = type === 'success' ? 'ph-fill ph-check-circle text-emerald-400 text-xl' : 'ph-fill ph-warning-circle text-rose-400 text-xl';
            toast.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('-translate-y-20', 'opacity-0'), 3000);
        };

        const hideLoader = () => document.getElementById('loader').classList.add('hidden');
        const showLoader = () => document.getElementById('loader').classList.remove('hidden');

        // 5. التهيئة المبدئية (Seeding)
        const seedDatabase = async () => {
            if (appData.users.length === 0) {
                console.log("Seeding default data...");
                const admin = { id: '1000', name: 'المدير العام', role: 'Admin', password: '123', wage: 0, status: 'Active' };
                const worker = { id: '1001', name: 'أحمد محمد', role: 'Worker', password: '123', wage: 150, status: 'Active' };
                const project = { id: 'P-101', name: 'مشروع أبراج الرياض', lat: 24.7136, lng: 46.6753, radius: 1000, status: 'Active' };
                
                await setDoc(doc(getPath('users'), admin.id), admin);
                await setDoc(doc(getPath('users'), worker.id), worker);
                await setDoc(doc(getPath('projects'), project.id), project);
            }
        };

        // 6. تشغيل النظام وجلب البيانات لحظياً
        const startApp = async () => {
            try {
                // تسجيل دخول مخفي للاتصال بقاعدة البيانات
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                // الاستماع للتغييرات في قواعد البيانات لحظياً
                const collections = ['users', 'projects', 'attendance', 'requests'];
                collections.forEach(col => {
                    onSnapshot(getPath(col), (snapshot) => {
                        appData[col] = snapshot.docs.map(doc => ({ uid: doc.id, ...doc.data() }));
                        
                        if (col === 'users') seedDatabase(); // فحص التهيئة
                        renderApp(); // تحديث الشاشة
                    });
                });

                // التحقق من وجود تسجيل دخول سابق في المتصفح
                const savedSession = localStorage.getItem('arkan_session');
                if (savedSession) currentUser = JSON.parse(savedSession);

                hideLoader();
            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerHTML = `<div class="text-rose-500 font-bold p-4 bg-white rounded-xl">حدث خطأ في الاتصال بالسحابة. الرجاء المحاولة لاحقاً.</div>`;
            }
        };

        // --- واجهات المستخدم (UI Rendering) ---

        const renderApp = () => {
            const container = document.getElementById('app-container');
            container.classList.remove('hidden');

            if (!currentUser) {
                // شاشة الدخول
                container.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-200 fade-in">
                            <div class="text-center mb-8">
                                <div class="w-16 h-16 bg-blue-900 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg">
                                    <i class="ph-fill ph-buildings text-white text-3xl"></i>
                                </div>
                                <h1 class="text-2xl font-bold text-slate-800">أركان الخليج (ERP)</h1>
                                <p class="text-sm text-slate-500 mt-1">نظام إدارة المشاريع وتكاليف العمالة</p>
                            </div>
                            <form onsubmit="window.handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-1">رقم المستخدم (ID)</label>
                                    <input type="number" id="login-id" class="w-full px-4 py-3 rounded-xl border bg-slate-50 outline-none focus:ring-2 focus:ring-blue-600 font-bold" required placeholder="مثال: 1000 للإدارة">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 mb-1">كلمة المرور</label>
                                    <input type="password" id="login-pass" class="w-full px-4 py-3 rounded-xl border bg-slate-50 outline-none focus:ring-2 focus:ring-blue-600 font-bold" required placeholder="مثال: 123">
                                </div>
                                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 mt-2">
                                    دخول النظام <i class="ph-bold ph-arrow-left"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            } else if (currentUser.role === 'Worker') {
                // شاشة العامل
                const activeSession = appData.attendance.find(a => a.workerId === currentUser.id && a.status === 'Working');
                const projectsOptions = appData.projects.filter(p => p.status === 'Active').map(p => `<option value="${p.id}">${p.name}</option>`).join('');

                container.innerHTML = `
                    <div class="min-h-screen bg-slate-50 flex flex-col">
                        <header class="bg-white shadow-sm p-4 flex justify-between items-center border-b sticky top-0 z-10">
                            <div>
                                <h1 class="font-bold text-slate-800 text-lg">بوابة العمال</h1>
                                <p class="text-xs text-slate-500 font-medium">${currentUser.name} | كود: ${currentUser.id}</p>
                            </div>
                            <button onclick="window.handleLogout()" class="p-2.5 bg-slate-100 rounded-full text-slate-600 hover:bg-rose-50 hover:text-rose-600 transition-colors"><i class="ph-bold ph-power text-xl"></i></button>
                        </header>
                        <main class="p-4 max-w-md mx-auto w-full mt-4 flex-1 fade-in">
                            ${!activeSession ? `
                                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-5">
                                    <h2 class="font-bold text-slate-800 flex items-center gap-2 border-b pb-3"><i class="ph-fill ph-play-circle text-emerald-500 text-xl"></i> بدء جلسة عمل</h2>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-600 mb-1">المشروع الحالي (إلزامي)</label>
                                        <select id="worker-proj" class="w-full p-3.5 border rounded-xl bg-slate-50 outline-none font-bold">
                                            <option value="">-- اختر المشروع --</option>
                                            ${projectsOptions}
                                        </select>
                                    </div>
                                    <button onclick="window.workerCheckIn()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl flex justify-center items-center gap-2 shadow-md">
                                        <i class="ph-bold ph-fingerprint text-xl"></i> تسجيل الحضور
                                    </button>
                                </div>
                            ` : `
                                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center space-y-6">
                                    <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto shadow-inner"><i class="ph-duotone ph-briefcase text-4xl animate-pulse"></i></div>
                                    <div>
                                        <h2 class="text-xl font-bold text-slate-800">أنت في العمل الآن</h2>
                                        <p class="text-sm text-slate-500 mt-1 font-bold">${activeSession.projectName}</p>
                                        <p class="text-xs text-blue-600 font-bold mt-3 bg-blue-50 inline-block px-4 py-2 rounded-full border border-blue-100">
                                            دخول: ${new Date(activeSession.checkIn).toLocaleTimeString('ar-SA')}
                                        </p>
                                    </div>
                                    <button onclick="window.workerCheckOut('${activeSession.uid}')" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 rounded-xl flex justify-center items-center gap-2 shadow-md">
                                        <i class="ph-bold ph-stop-circle text-xl"></i> إنهاء العمل (انصراف)
                                    </button>
                                </div>
                            `}
                        </main>
                    </div>
                `;
            } else {
                // شاشة الإدارة (Admin)
                container.innerHTML = `
                    <div class="flex h-screen bg-slate-50 w-full">
                        <!-- Sidebar -->
                        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col z-20 shrink-0">
                            <div class="p-6 bg-slate-950 flex items-center gap-3 border-b border-slate-800">
                                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white"><i class="ph-fill ph-hexagon text-2xl"></i></div>
                                <div><h1 class="text-white font-bold">نظام الإدارة</h1><p class="text-[10px] text-blue-400">تزامن سحابي لحظي</p></div>
                            </div>
                            <nav class="flex-1 p-4 space-y-1">
                                <button onclick="window.switchTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeAdminTab==='dashboard'?'bg-blue-600 text-white':'hover:bg-slate-800'}"><i class="ph-duotone ph-chart-bar text-xl"></i> التكاليف والتقارير</button>
                                <button onclick="window.switchTab('setup')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeAdminTab==='setup'?'bg-blue-600 text-white':'hover:bg-slate-800'}"><i class="ph-duotone ph-gear text-xl"></i> إعدادات النظام</button>
                            </nav>
                            <div class="p-4 bg-slate-950 border-t border-slate-800 text-center">
                                <p class="text-xs text-slate-500 mb-2">${currentUser.name}</p>
                                <button onclick="window.handleLogout()" class="w-full py-2 border border-rose-500/50 text-rose-500 hover:bg-rose-500 hover:text-white rounded-lg text-sm font-bold transition-colors">خروج</button>
                            </div>
                        </aside>
                        
                        <!-- Main Content -->
                        <main class="flex-1 overflow-y-auto p-8 relative">
                            ${activeAdminTab === 'dashboard' ? renderAdminDashboard() : renderAdminSetup()}
                        </main>
                    </div>
                `;

                // تفعيل الرسم البياني إذا كنا في لوحة القيادة
                if (activeAdminTab === 'dashboard') initChart();
            }
        };

        const renderAdminDashboard = () => {
            const completed = appData.attendance.filter(a => a.status === 'Completed');
            let totalCost = 0; let totalHours = 0;
            
            completed.forEach(a => {
                totalCost += a.totalCost || 0;
                totalHours += a.hours || 0;
            });

            return `
                <div class="space-y-6 fade-in max-w-6xl mx-auto">
                    <h2 class="text-2xl font-bold text-slate-800 border-b pb-4">التقارير المالية وتكلفة العمالة</h2>
                    
                    <!-- KPIs -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <p class="text-sm text-slate-500 font-bold">إجمالي تكلفة العمالة</p>
                            <h3 class="text-3xl font-black text-emerald-600 mt-2">${totalCost.toLocaleString(undefined, {minimumFractionDigits:2})} <span class="text-sm font-normal">ر.س</span></h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <p class="text-sm text-slate-500 font-bold">إجمالي ساعات العمل</p>
                            <h3 class="text-3xl font-black text-blue-600 mt-2">${totalHours.toFixed(1)} <span class="text-sm font-normal">ساعة</span></h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <p class="text-sm text-slate-500 font-bold">جلسات العمل المكتملة</p>
                            <h3 class="text-3xl font-black text-indigo-600 mt-2">${completed.length}</h3>
                        </div>
                    </div>

                    <!-- Chart & Table -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 lg:col-span-2 h-80 flex flex-col">
                            <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="ph-duotone ph-chart-bar text-blue-500 text-lg"></i> التكلفة الموزعة على المشاريع</h3>
                            <div class="flex-1 relative w-full h-full"><canvas id="costChart"></canvas></div>
                        </div>

                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-80">
                            <div class="p-4 border-b bg-slate-50"><h3 class="font-bold text-slate-700">سجل الحضور الحي</h3></div>
                            <div class="flex-1 overflow-y-auto p-0">
                                <ul class="divide-y divide-slate-100 text-sm">
                                    ${appData.attendance.sort((a,b)=> new Date(b.checkIn)-new Date(a.checkIn)).map(a => `
                                        <li class="p-4 hover:bg-slate-50">
                                            <div class="flex justify-between items-center mb-1">
                                                <span class="font-bold text-slate-800">${a.workerName}</span>
                                                ${a.status === 'Working' ? '<span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded font-bold animate-pulse">يعمل الآن</span>' : `<span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-bold">${a.totalCost.toFixed(1)} ر.س</span>`}
                                            </div>
                                            <div class="text-xs text-slate-500">${a.projectName}</div>
                                        </li>
                                    `).join('')}
                                    ${appData.attendance.length === 0 ? '<li class="p-4 text-center text-slate-400">لا يوجد حركات مسجلة</li>' : ''}
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        const renderAdminSetup = () => `
            <div class="space-y-6 fade-in max-w-6xl mx-auto">
                <h2 class="text-2xl font-bold text-slate-800 border-b pb-4">إعدادات النظام والكيانات</h2>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    
                    <!-- إضافة عمال -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[500px]">
                        <div class="p-4 border-b bg-blue-50"><h3 class="font-bold text-blue-800">إدارة العمال (Workers)</h3></div>
                        <form onsubmit="window.adminAddWorker(event)" class="p-4 border-b bg-slate-50 grid grid-cols-2 gap-2">
                            <input type="number" id="w-id" required placeholder="كود العامل (ID)" class="p-2.5 rounded-lg border outline-none font-bold text-sm">
                            <input type="text" id="w-name" required placeholder="اسم العامل" class="p-2.5 rounded-lg border outline-none font-bold text-sm">
                            <input type="password" id="w-pass" required placeholder="كلمة المرور" class="p-2.5 rounded-lg border outline-none font-bold text-sm">
                            <input type="number" id="w-wage" required placeholder="الأجر اليومي" class="p-2.5 rounded-lg border outline-none font-bold text-sm">
                            <button type="submit" class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors">إضافة للعاملين</button>
                        </form>
                        <ul class="flex-1 overflow-y-auto p-0 divide-y divide-slate-100 text-sm">
                            ${appData.users.filter(u=>u.role==='Worker').map(u => `
                                <li class="p-4 flex justify-between items-center hover:bg-slate-50">
                                    <div><p class="font-bold">${u.name}</p><p class="text-xs text-slate-500">كود: ${u.id} | الأجر: ${u.wage} ر.س</p></div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <!-- إضافة مشاريع -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[500px]">
                        <div class="p-4 border-b bg-indigo-50"><h3 class="font-bold text-indigo-800">إدارة المشاريع (Projects)</h3></div>
                        <form onsubmit="window.adminAddProject(event)" class="p-4 border-b bg-slate-50 grid grid-cols-2 gap-2">
                            <input type="text" id="p-id" required placeholder="كود المشروع (مثال: P-01)" class="col-span-2 p-2.5 rounded-lg border outline-none font-bold text-sm">
                            <input type="text" id="p-name" required placeholder="اسم المشروع" class="col-span-2 p-2.5 rounded-lg border outline-none font-bold text-sm">
                            <button type="submit" class="col-span-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition-colors mt-2">إضافة مشروع جديد</button>
                        </form>
                        <ul class="flex-1 overflow-y-auto p-0 divide-y divide-slate-100 text-sm">
                            ${appData.projects.map(p => `
                                <li class="p-4 hover:bg-slate-50">
                                    <p class="font-bold">${p.name}</p><p class="text-xs text-slate-500">كود: ${p.id}</p>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                </div>
            </div>
        `;

        const initChart = () => {
            const ctx = document.getElementById('costChart');
            if (!ctx) return;

            const projCosts = {};
            appData.attendance.filter(a => a.status === 'Completed').forEach(a => {
                if(!projCosts[a.projectName]) projCosts[a.projectName] = 0;
                projCosts[a.projectName] += a.totalCost || 0;
            });

            if (costChart) costChart.destroy();
            costChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(projCosts),
                    datasets: [{ label: 'التكلفة بالريال', data: Object.values(projCosts), backgroundColor: '#3b82f6', borderRadius: 6 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        };

        // --- الأحداث والدوال العامة (Actions) ---

        window.handleLogin = async (e) => {
            e.preventDefault();
            const id = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;
            
            showLoader();
            const user = appData.users.find(u => u.id === id && u.password === pass);
            
            if (user) {
                if(user.status !== 'Active') {
                    showToast('حسابك موقوف', 'error');
                } else {
                    currentUser = user;
                    localStorage.setItem('arkan_session', JSON.stringify(user));
                    window.showToast('تم تسجيل الدخول بنجاح');
                    renderApp();
                }
            } else {
                window.showToast('بيانات الدخول غير صحيحة', 'error');
            }
            hideLoader();
        };

        window.handleLogout = () => {
            currentUser = null;
            localStorage.removeItem('arkan_session');
            renderApp();
        };

        window.switchTab = (tab) => {
            activeAdminTab = tab;
            renderApp();
        };

        // أحداث العامل
        window.workerCheckIn = async () => {
            const projId = document.getElementById('worker-proj').value;
            if(!projId) return window.showToast('اختر المشروع أولاً', 'error');
            
            showLoader();
            const project = appData.projects.find(p => p.id === projId);
            
            try {
                await addDoc(getPath('attendance'), {
                    workerId: currentUser.id,
                    workerName: currentUser.name,
                    projectId: project.id,
                    projectName: project.name,
                    checkIn: new Date().toISOString(),
                    checkOut: null,
                    wageAtTime: currentUser.wage || 0, // تجميد الراتب لحفظ التكلفة التاريخية
                    status: 'Working'
                });
                window.showToast('تم تسجيل الحضور وفتح جلسة العمل');
            } catch(e) { window.showToast('خطأ في الاتصال', 'error'); }
            hideLoader();
        };

        window.workerCheckOut = async (uid) => {
            showLoader();
            try {
                const session = appData.attendance.find(a => a.uid === uid);
                const outTime = new Date();
                const inTime = new Date(session.checkIn);
                
                // حساب الساعات (بشكل مبسط للتجربة: نحسب الثواني كأنها ساعات ليظهر فرق في التكلفة سريعاً)
                const hours = (outTime - inTime) / (1000 * 60 * 60); 
                const totalCost = hours * (session.wageAtTime / 8); // بافتراض الأجر لـ 8 ساعات

                await updateDoc(doc(getPath('attendance'), uid), {
                    checkOut: outTime.toISOString(),
                    hours: hours,
                    totalCost: totalCost,
                    status: 'Completed'
                });
                window.showToast('تم إنهاء العمل وحساب التكلفة للإدارة');
            } catch(e) { window.showToast('خطأ في الاتصال', 'error'); }
            hideLoader();
        };

        // أحداث الإدارة
        window.adminAddWorker = async (e) => {
            e.preventDefault();
            const id = document.getElementById('w-id').value;
            if(appData.users.find(u => u.id === id)) return window.showToast('الكود مستخدم', 'error');
            
            showLoader();
            try {
                await setDoc(doc(getPath('users'), id), {
                    id,
                    name: document.getElementById('w-name').value,
                    password: document.getElementById('w-pass').value,
                    wage: Number(document.getElementById('w-wage').value),
                    role: 'Worker',
                    status: 'Active'
                });
                window.showToast('تمت إضافة العامل بنجاح');
            } catch(e) { window.showToast('خطأ', 'error'); }
            hideLoader();
        };

        window.adminAddProject = async (e) => {
            e.preventDefault();
            const id = document.getElementById('p-id').value.toUpperCase();
            if(appData.projects.find(p => p.id === id)) return window.showToast('الكود مستخدم', 'error');
            
            showLoader();
            try {
                await setDoc(doc(getPath('projects'), id), {
                    id,
                    name: document.getElementById('p-name').value,
                    status: 'Active'
                });
                window.showToast('تم إضافة المشروع بنجاح');
            } catch(e) { window.showToast('خطأ', 'error'); }
            hideLoader();
        };

        // بدء تشغيل النظام
        window.addEventListener('DOMContentLoaded', startApp);

    </script>
</body>
</html>
